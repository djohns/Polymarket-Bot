# Fase 2, parte 4: sirve únicamente el dashboard estático (data/dashboard.html),
# regenerado cada 15 min por polymarket-bot-dashboard.timer. Puerto no estándar +
# HTTP Basic Auth como protección básica (contenido no sensible -- paper trading,
# sin claves ni datos de cuenta -- pero es un servicio nuevo expuesto a internet).
# Ver CLAUDE.md para la justificación completa.
#
# Instalar como /etc/nginx/conf.d/dashboard.conf.

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    # No hay root de filesystem: sólo este único archivo es alcanzable, nada más
    # del árbol de datos (ni la base SQLite ni ningún otro path) se expone.
    location = /dashboard.html {
        alias /opt/polymarket-bot/data/dashboard.html;
        auth_basic "Polymarket Bot Dashboard (Fase 2)";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location = / {
        return 301 /dashboard.html;
    }

    location / {
        return 404;
    }
}
