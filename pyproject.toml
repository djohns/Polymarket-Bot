[project]
name = "polybot"
version = "0.1.0"
description = "Bot de trading para Polymarket: arbitraje intra-mercado y market-making pasivo"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client-v2>=1.1.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
